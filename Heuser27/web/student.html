<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Showcase — Heuser27 CRP Arcade</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">
        <div class="brand-crest" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L9 6.5 4 5l2.5 5L3 13l4.5 1.5L6 20l6-3 6 3-1.5-5.5L21 13l-3.5-3L20 5l-5 1.5L12 2z"/></svg>
        </div>
        <div>
          <div class="brand-title">HEUSER27 ARCADE</div>
          <div class="brand-sub">CRP Programming &amp; Problem Solving with AI</div>
        </div>
      </a>

      <div class="topbar-actions">
        <a href="/" class="btn btn-ghost btn-sm">← All Students</a>
        <a href="/admin" class="btn btn-ghost btn-sm">Admin Panel</a>
      </div>
    </div>
  </header>

  <main class="container" id="mainContainer">
    <section class="student-header" id="studentHeader">
      <div class="student-identity">
        <div class="student-avatar-lg" id="studentAvatar">--</div>
        <div>
          <h1 id="studentName">Loading student...</h1>
          <div class="student-meta-row" id="studentMeta"></div>
        </div>
      </div>
      <div class="topbar-actions" id="studentQuickStats"></div>
    </section>

    <section class="hw-tabs" id="hwTabs" aria-label="Student homework submissions"></section>

    <section class="stage-grid" id="stageGrid" hidden>
      <div class="panel" id="projectStage"></div>

      <aside class="panel">
        <div class="vote-box">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <span style="font-family:var(--font-display);font-weight:800;font-size:1rem;">Project Vote</span>
            <span class="badge badge-batch tabular" id="voteCountBadge">0 votes</span>
          </div>
          <p style="margin:0;font-size:0.8rem;color:#C5D5E5;">
            No login required. Each IP address can cast 1 vote per project.
          </p>
          <button id="voteBtn" class="vote-btn" type="button">
            Upvote This Project
          </button>
        </div>

        <div>
          <h3 style="font-family:var(--font-display);margin:0 0 10px;font-size:1rem;">
            Feedback &amp; Comments (<span id="commentTotal" class="tabular">0</span>)
          </h3>
          <form id="commentForm" style="display:flex;flex-direction:column;gap:9px;">
            <input id="commentAuthor" class="input" type="text" maxlength="50" placeholder="Your name (optional, default: Visitor)" />
            <textarea id="commentBody" class="textarea" rows="3" maxlength="800" required placeholder="Write encouraging feedback or a bug note..."></textarea>
            <button class="btn btn-primary" type="submit">Post Comment</button>
          </form>

          <div class="comment-list" id="commentList"></div>
        </div>
      </aside>
    </section>

    <div class="empty-state" id="noSubsState" hidden>
      This student has not submitted any homework projects yet.
    </div>
  </main>

  <script src="/assets/app.js"></script>
  <script src="/assets/student.js"></script>
</body>
</html>
